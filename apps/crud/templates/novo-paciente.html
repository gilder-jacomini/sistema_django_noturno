{% extends 'base-crud.html' %}
{% block title %} CRUD | Cadastro de Paciente {% endblock %}
{% load static %}
{% block content %}

    <h1 class="mt-5"> <i class="fa-solid fa-plus"></i>
    Cadastrar Novo Paciente
    <i class="fa-solid fa-plus"></i>
    </h1>

<hr>
{% if error %}<p>{{ error }}</p>{% endif %}
<form action="{% url 'novo_paciente' %}" method="post">
    {% csrf_token %}
    {% include 'includes/form.html' %}
    <div class="d-flex justify-content-start mt-5 mb-5">
        <button type="submit" class="btn btn-primary"> 
                <i class="fa-regular fa-floppy-disk"></i> Cadastar nono Paciente
        </button>
    </div>
   
</form>

<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
